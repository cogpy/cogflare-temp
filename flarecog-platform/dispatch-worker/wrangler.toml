name = "flarecog-dispatch"
main = "src/index.ts"
compatibility_date = "2024-11-23"

# Dispatch namespace binding
[[dispatch_namespaces]]
binding = "FLARECOG_NAMESPACE"
namespace = "flarecog"

# KV namespace for tenant configuration
[[kv_namespaces]]
binding = "TENANT_CONFIG"
id = "YOUR_TENANT_CONFIG_KV_ID"  # Replace with actual KV namespace ID

# KV namespace for rate limiting
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "YOUR_RATE_LIMITS_KV_ID"  # Replace with actual KV namespace ID

# D1 database for analytics
[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "flarecog_analytics"
database_id = "YOUR_ANALYTICS_DB_ID"  # Replace with actual D1 database ID

# Environment variables
[vars]
PLATFORM_NAME = "FlareCog Multi-Tenant Platform"
BASE_DOMAIN = "flarecog.ai"
DEFAULT_RATE_LIMIT = "1000"
REQUIRE_AUTH = "true"

# Routes (configure your custom domain)
# [[routes]]
# pattern = "*.flarecog.ai/*"
# zone_name = "flarecog.ai"

# Development configuration
[env.development]
vars = { REQUIRE_AUTH = "false" }

# Production configuration
[env.production]
vars = { REQUIRE_AUTH = "true" }
